<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>深红之王：逆命残魂</title><style>:root{--bg:#07080b;--p:#11151c;--p2:#171c25;--fg:#ececf0;--mut:#9ba2ae;--red:#b42740;--gold:#c9aa62;--cyan:#72d1ca}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#2a0c14 0,transparent 34%),linear-gradient(#07080b,#0b0e13);color:var(--fg);font-family:"Songti SC","Microsoft YaHei",serif}body{overflow-x:hidden}canvas{position:fixed;inset:0;pointer-events:none;z-index:0}.app{position:relative;z-index:1;min-height:100vh}header{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:#090b0fe8;border-bottom:1px solid #262c36;backdrop-filter:blur(12px)}h1{font-size:18px;margin:0;letter-spacing:.08em}.sub{font-size:11px;color:var(--mut)}button{border:1px solid #343b48;background:#151a22;color:#eee;border-radius:9px;padding:9px 11px;font-family:inherit;cursor:pointer}.red{background:linear-gradient(#852039,#531322);border-color:#a2354d}.gold{background:#4b4024;border-color:#8d7741}.wrap{display:grid;grid-template-columns:210px 1fr 290px;min-height:calc(100vh - 61px)}nav,aside{background:#0b0e13cc;padding:12px}nav{border-right:1px solid #242a33}aside{border-left:1px solid #242a33}.nav{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border-color:transparent}.nav.on{background:#1a202a;border-color:#303744}main{padding:18px;min-width:0}.hero,.box{border:1px solid #2c323c;border-radius:14px;background:#10141be8;padding:18px}.hero{background:linear-gradient(135deg,#38101a99,#11151ce8 55%);box-shadow:0 18px 45px #0007}.hero h2{font-size:30px;margin:5px 0 8px}.k{font-size:11px;color:var(--gold);letter-spacing:.2em}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip,.tag{font-size:11px;border:1px solid #363e4b;border-radius:99px;padding:5px 8px;color:#c9ced6}.box{margin-top:14px}.story{line-height:1.9;white-space:pre-wrap;color:#dcdfe5}.choices{display:grid;gap:9px;margin-top:14px}.choice{text-align:left;padding:13px}.choice b{display:block;margin-bottom:5px}.choice small{color:var(--mut);line-height:1.5}.card{border:1px solid #2a303b;border-radius:10px;background:#131821;padding:11px;margin:8px 0}.card h4{margin:0 0 6px}.card p{margin:0;color:#afb6c1;line-height:1.6;font-size:13px}.barrow{margin:10px 0}.barhead{display:flex;justify-content:space-between;font-size:12px}.bar{height:7px;border-radius:99px;background:#222832;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7d182b,#da405b)}.cyan i{background:linear-gradient(90deg,#286b67,#71d1cb)}.goldbar i{background:linear-gradient(90deg,#66562c,#c6a85d)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quote{border-left:3px solid var(--red);padding:10px 13px;background:#13171e;margin:12px 0;color:#f2dfe4}.locked{opacity:.45;filter:grayscale(1)}textarea{width:100%;min-height:170px;background:#0b0e13;color:#eee;border:1px solid #343b47;border-radius:9px;padding:10px}.modal{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal>div{width:min(700px,96vw);max-height:86vh;overflow:auto;background:#11161e;border:1px solid #39414d;border-radius:14px;padding:16px}@media(max-width:1000px){.wrap{grid-template-columns:180px 1fr}aside{display:none}}@media(max-width:700px){header .desktop{display:none}.wrap{display:block}nav{display:flex;gap:6px;overflow:auto;border-right:0;border-bottom:1px solid #262c35;padding:8px}.nav{width:auto;white-space:nowrap}main{padding:12px}.grid{grid-template-columns:1fr}.hero h2{font-size:25px}}</style></head><body><canvas id="fx"></canvas><div class="app"><header><div><h1>深红之王：逆命残魂</h1><div class="sub">Harak · 逆天改命叙事 RPG</div></div><div class="desktop"><button onclick="save()">保存</button> <button onclick="load()">读取</button> <button onclick="io()">导入/导出</button></div></header><div class="wrap"><nav id="nav"><button class="nav on" data-v="story">剧情</button><button class="nav" data-v="timeline">年表</button><button class="nav" data-v="codex">图鉴</button><button class="nav" data-v="chapters">章节</button><button class="nav" data-v="log">命途</button><button class="nav" data-v="settings">设置</button></nav><main id="main"></main><aside id="aside"></aside></div></div><div class="modal" id="m"><div><h3>存档导入 / 导出</h3><textarea id="txt"></textarea><p><button class="gold" onclick="exp()">生成导出文本</button> <button class="red" onclick="imp()">导入</button> <button onclick="m.classList.remove('open')">关闭</button></p></div></div><script>const C=[{t:'序章·深红再世',m:'陌生、警觉、宿命初醒',a:'人身 · 深红之魂 · 生命熔炉（沉睡）',x:`世界并不知道，某个普通人的肉身里，承载的并非普通灵魂。\n\n他叫 Harak。\n\n肉身来自现实世界，而灵魂来自曾经以魂道冠绝一世的存在——深红之王。前世，他以魂道为主，炎道、宇道为辅，亦涉变化等诸道。生命熔炉埋藏在身体最深处。\n\n远在诸天之上的高维，龙王古兰桑克斯也察觉到那缕不该再出现的深红气息。`,c:[['审视自身灵魂','确认前世魂道底蕴与生命熔炉。',{soul:8,will:4}],['压下气息，先活下去','降低早期暴露。',{heaven:-4,exposure:-5}]]},{t:'第一章·高维来敌',m:'压迫、警惕、战意初燃',a:'魂道手段 · 炎道余韵 · 宇道本能',x:`古兰桑克斯没有亲自降临。\n\n祂派出的是维克。\n\n“癫火与龙雷之王维克”是同一个存在。长枪贯穿 Harak，五禁玄光气封锁空间。\n\n而真正的灾厄，是那头只为毁灭而存在的灭尽龙。`,c:[['以宇道寻找破局','为日后定仙游与空间杀招铺垫。',{space:8}],['以魂压硬撼杀意','提升魂道侵略性，但更易暴露。',{soul:10,exposure:5}]]},{t:'第二章·毁灭道痕',m:'濒死、狠厉、求生',a:'定仙游（觉醒） · 魂道 · 受创本体',x:`灭尽龙的攻击落在胸口。\n\n毁灭道痕像活着的诅咒，持续啃噬 Harak 的肉身。除非真正毁去，否则不会消失。\n\n灭尽龙的龙息轰碎维克的壁障后离开。Harak 抓住缝隙，一只绿色蝴蝶般的仙蛊振翅——定仙游。`,c:[['定仙游——撤离','瞬移至记忆中的安全地点。',{hp:10}],['记住两者气息','为后续追踪留下锚点。',{intel:8}]]},{t:'第三章·战部渡',m:'分裂、牺牲、冷酷',a:'分魂之术 · 力道/变化道分魂 · 本体受毁灭侵蚀',x:`战部渡，是 Harak 的力道与变化道分魂。\n\n维克继续追杀。战部渡最终被逼入绝境，选择自爆。仙窍毁灭，大同风被引出。\n\n部分至尊仙胎蛊材料也曾在他的仙窍中。`,c:[['记下这笔债','强化面对维克时的意志。',{will:10}],['只计算损失与收益','更冷酷、更稳定。',{stability:7}]]},{t:'第四章·王气与炉火',m:'谋划、贪取、重构',a:'魂道 · 炎道 · 宇道 · 生命熔炉',x:`Harak 曾抵达北京紫禁城，夺取康熙大帝的一缕王气，将其与守护地灵收入仙窍，随后回到荡魂山炼化。\n\n更疯狂的目标逐渐清晰：至尊仙胎蛊。\n\n他要获得真正不受天意支配的天外之魔之躯。`,c:[['推进至尊仙胎蛊计划','解锁天外之魔长期目标。',{research:12}],['先寻找毁灭道痕根治法','更早锁定律道方向。',{intel:10}]]},{t:'第五章·柳贯一',m:'隐匿、清冷、试探',a:'态度仙蛊 · 六转伪装 · 定仙游',x:`上海。\n\nHarak 催动态度仙蛊，换了一张清澈、仙气、少年感极重的面孔，也换了一个名字：柳贯一。\n\n他进入上海第一高中。东方明珠之下，则藏着天机仙蛊与守护它的白泽。`,c:[['先以学生身份潜伏','降低暴露并建立自然关系。',{exposure:-10,bond:3}],['直接探查天机域','更快接触天机，但风险更高。',{heaven:8,intel:8}]]},{t:'第六章·盗天机',m:'剧痛、疯狂、命悬一线',a:'态度仙蛊 · 天机接触 · 人如故（濒碎）',x:`白泽警告柳贯一：若想解决深入存在结构的伤势，要寻找未来的律道命定尊者，其关键将是“修复”。\n\nHarak 仍旧窥探天机。七窍流血，心跳失控，近乎死亡。\n\n他用濒碎的人如故仙蛊将自己拉回死亡线，随后人如故彻底破碎，化作道痕散落上海。`,c:[['记住白泽的预言','解锁律心命定尊者线。',{intel:12}],['记录天机反噬结构','提升对天意的理解。',{heavenSense:10}]]},{t:'第七章·数学题与面包',m:'克制、温和、渐近',a:'柳贯一身份 · 态度仙蛊 · 魂道观察',x:`她叫林律心。\n\n第一次接近她，柳贯一没有动用惊天杀招，只是一道数学题。之后，是一起吃饭，是面包，是一次又一次看似寻常的陪伴。\n\nHarak 确实带着目的，可柳贯一留下的记忆，也逐渐拥有与目的无关的重量。`,c:[['维持自然相处','强化柳贯一人格痕迹与律心信任。',{bond:12,liuWill:8}],['保持距离，只观察命数','更理性。',{intel:8,bond:4}]]},{t:'第八章·改变她的家',m:'愤怒、计算、隐秘干涉',a:'魂道搜忆 · 记忆改写 · 柳贯一身份',x:`Harak 发现律心的过去：母亲早逝，父亲长期暴力。\n\n他推演改变这一切是否会影响未来尊者之路，结果并不绝对。于是他用魂道改写其父亲记忆与行为倾向，降低暴力。\n\n此后整个学期，柳贯一频繁陪伴律心，她越来越快乐，也越来越信任他。`,c:[['继续陪伴整个学期','强化柳贯一与律心之间最重要的因果。',{bond:18,liuWill:12}],['暗中监控天意波动','为之后失踪保留更多线索。',{heavenSense:12}]]},{t:'第九章·天意抹除',m:'惊骇、执拗、不惜代价',a:'大范围魂搜 · 魂道重构 · 态度仙蛊',x:`律心突然消失。\n\nHarak 大范围魂搜也找不到她，最终确认：天意正在干涉、抹除。\n\n他用剩余魂道力量重构她的形体、记忆、感官、认知与情感，并把柳贯一记忆中关于她的一切交还。\n\n随后柳贯一把态度仙蛊、定仙游及剩余手段交给她，自己化作一缕意念，进入她灵魂最深处。`,c:[['化念沉入律心深处','柳贯一残念由此诞生。',{liuWill:20,soul:-12}],['留下魂道锚点','增加后续对残念的感知。',{soulLink:8}]]},{t:'第十章·十年之后',m:'期待、试探、旧局重启',a:'Harak 本体苏醒 · 天机域 · 律道试炼',x:`柳贯一消失后，Harak 原本体在荡魂山醒来。\n\n十年过去，律心已成为律道大宗师。Harak 将她送入天机蛊内部的银灰平原。\n\n她真正修复了天机蛊。天机与律道融合，修复仙蛊诞生。律心成尊，如大日凌空；白泽恢复完整，成为她的护道人。`,c:[['前往东方明珠上空等待','进入正面对峙。',{heaven:10}],['观察柳贯一残念','增加后续魂道信息。',{soulLink:10}]]},{t:'第十一章·我爱的是柳贯一',m:'撕裂、癫狂、执念',a:'魂道道主 · 修复仙蛊在律心手中 · 白泽护道',x:`东方明珠上空。\n\nHarak 问：“律心，你知道我是何人吗？”\n\n天机让她看见 Harak 最初接近、帮助、培养她的真正目的：让她有一天修复灭尽龙留下的毁灭道痕。\n\n她拒绝了他。\n\n“我爱的人是柳贯一，并不是你 Harak。”\n\nHarak 大笑，魂道道主级力量开始寻找她灵魂深处的柳贯一残念。残念回应，也第一次表现出对本体的独立抗拒。`,c:[['以魂压触及柳贯一残念','推进既定历史。',{soul:15,bond:-8}],['先让残念自己选择','强化残念独立性。',{liuWill:15}]]},{t:'第十二章·七彩贯胸',m:'狂喜、危险、命运反转',a:'魂道道主 · 修复仙蛊作用中 · 毁灭道痕解除',x:`柳贯一残念最终影响律心。\n\n修复仙蛊发动，七彩光束贯穿 Harak 胸口。纠缠漫长岁月的毁灭道痕终于被驱散。\n\nHarak 狂笑感谢律心。\n\n然后——他的身体开始崩解。失去毁灭道痕遮蔽后，天意终于能够完整识别这个“不该存在”的人。`,c:[['魂魄离体，舍弃肉身','进入九转命败天劫清算。',{hp:-30,heaven:30}],['记录天意清算结构','为未来留下认知。',{heavenSense:15}]]},{t:'第十三章·命败天劫',m:'绝境、求生、拒绝死亡',a:'残魂 · 九转命败天劫 · 生命熔炉崩碎',x:`肉身与仙窍被毁。Harak 的灵魂暴露在九转命败天劫与残余毁灭道痕中。\n\n生命熔炉化作大道碎片，散落世界各地。\n\n近乎失去一切时，他想起最后的后手：藏在柳贯一体内的态度蛊。\n\n他不能死。`,c:[['发动换魂杀招','夺取/覆盖柳贯一残躯。',{soul:-10,stability:8}],['先以态度蛊重定义“我”','增加换魂稳定性。',{stability:12}]]},{t:'第十四章·净魂既灭',m:'虚弱、清醒、余生',a:'柳贯一六转残躯 · 态度仙蛊（本命） · Harak 残魂',x:`Harak 成功借柳贯一残躯延续存在。\n\n净魂仙蛊随后洗净他残魂中的九转命败天劫残留与毁灭道痕，并因此彻底毁灭。\n\n此时体内主要只剩大量变化道道痕，以及 Harak 自己的魂道道痕。`,c:[['用态度蛊换一张新面孔','切断旧身份外观。',{exposure:-15}],['审视仙窍与本体可能','准备重新利用九转残躯。',{intel:10}]]},{t:'第十五章·九转残躯',m:'冷静、震动、重新筹谋',a:'六转外壳 · 九转魂道本体残躯（仙窍内） · 态度仙蛊',x:`Harak 将自己原来的身躯收入当前仙窍。\n\n那仍是九转魂道道主的本体。\n\n可胸口位置，毁灭道痕仍旧存在。\n\n外界的 Harak 只是六转；仙窍中的这具身体，却曾站在魂道顶点。如何处理它，决定他能否真正回来。`,c:[['寻找能处理毁灭道痕的律道强者','解锁自在书生线。',{intel:12}],['封存本体气息','降低未来行动风险。',{heaven:-10}]]},{t:'第十六章·自在书生',m:'推演、谨慎、暗藏希望',a:'六转柳贯一躯体 · 态度仙蛊 · 九转本体 · 定仙游',x:`一个名字浮上心头：自在书生。\n\n北原八转律道蛊仙。\n六转百解。\n七转千解。\n八转万解。\n\n万解可以对敌我使用，能化解除九转存在之外的一切。\n\n问题只有一个：一个六转身份不明的蛊仙，要如何让八转律道强者，对秘密九转本体主动施展核心杀招？`,c:[['定仙游——前往北原','进入当前最新阶段。',{space:10,heaven:3}],['先设计接近他的假身份','增加潜伏优势。',{exposure:-8,intel:8}]]},{t:'当前章·北原穷途',m:'曲折、坚毅、意贯一',a:'态度仙蛊（本命） · 六转外壳 · 残魂 · 九转本体（仙窍） · 定仙游',x:`北原风烈。\n\n绿色蝴蝶的残光在荒原中消失。\n\nHarak 站在天地之间：\n\n“曲折穷途天地窄，重重灾劫生死危。\n身如柳絮随风扬，无论云泥意贯一。”\n\n从这一刻开始，历史追上玩家。接下来如何接近自在书生、如何让万解落在毁灭道痕上、如何避免九转本体暴露后引发敌意，都将由玩家决定。`,c:[['伪装求医：六转散修身份求见','先展示被削弱的异常样本。',{exposure:4,intel:5}],['利益交换：献出律道罕见线索','以价值换取万解服务。',{intel:-5,trust:10}],['设局试探：先让他使用百解','先验证“解”系杀招兼容性。',{heaven:4,stability:-4,trust:4}]]},{t:'自由推演·万解之局',m:'未知、试探、棋局初开',a:'当前体系可用 · 九转本体仍受毁灭道痕影响',x:`这是第一段真正脱离既定历史的未来。\n\n自在书生尚未正式出现，但他的律道痕迹已进入 Harak 的感知。\n\n核心目标：让自在书生在不直接敌视 Harak 的前提下，对九转魂道本体胸口的毁灭道痕施展万解。\n\n硬限制：态度蛊可以改变面孔与存在认知，但不能无条件抹除八转强者的判断。九转本体一旦暴露，天意警戒与自在书生警惕都会骤升。`,c:[['继续寻找自在书生踪迹','追踪北原律道遗痕。',{intel:8}],['伪造七转层级毁灭样本','为百解/千解试验做准备。',{research:10,stability:-3}],['暂不接触，先稳固六转仙窍','降低风险，但
